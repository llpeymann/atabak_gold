services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atabak_gold_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      # Everything the bot must keep across restarts/redeploys lives here:
      # MARKET_STATE_FILE (validated market state), USER_DATA_FILE (users + favourites)
      # and ALERTS_DATA_FILE (price alerts + their delivery records).
      - atabak-market-state:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  atabak-market-state:
